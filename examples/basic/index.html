<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- About page display faces: Righteous (logo) + Caveat (sticky titles) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Righteous&family=Caveat:wght@600;700&display=swap"
    />
    <title>Basic Board — SpatialBoard</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        overscroll-behavior: none;
        /* Pan only — page pinch-zoom off; the board canvas zooms itself. */
        touch-action: pan-x pan-y;
      }
    </style>
    <script>
      // iOS Safari ignores the viewport meta for in-browser pinch — cancel its
      // proprietary gesture events so only the board canvas zooms.
      for (const t of ["gesturestart", "gesturechange", "gestureend"]) {
        document.addEventListener(t, (e) => e.preventDefault());
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
