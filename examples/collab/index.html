<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f3" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Collaboration — SpatialBoard</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        overscroll-behavior: none;
        /* Pan only — page pinch-zoom off; each board canvas zooms itself. */
        touch-action: pan-x pan-y;
      }
    </style>
    <script>
      // iOS Safari ignores the viewport meta for in-browser pinch — cancel its
      // proprietary gesture events so only the board canvases zoom.
      for (const t of ["gesturestart", "gesturechange", "gestureend"]) {
        document.addEventListener(t, (e) => e.preventDefault());
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
